[package]
name = "poller-tfl"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
health-http = { workspace = true }
# The snapshot producer for `ds:ingest:tfl` (ingest plan 3c.2): the only
# sink since release B.
ingest-stream = { workspace = true }
anyhow = "1.0.102"
chrono = { version = "0.4.44", features = ["serde"] }
clap = { version = "4.6.1", features = ["derive", "env"] }
common = { workspace = true, features = ["default"] }
ds-runtime = { workspace = true, features = ["default"] }
dotenvy = "0.15.7"
metrics = "0.24"
# Reading the stops stream back (the feed guard's baseline): the version
# ingest-stream uses.
redis = { version = "1.8", features = ["tokio-comp", "connection-manager"] }
reqwest = { version = "0.13.4", default-features = false, features = ["json", "native-tls", "gzip"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tokio = { version = "1.52.3", features = ["rt-multi-thread", "macros"] }
tracing = "0.1.44"

[lints]
workspace = true
