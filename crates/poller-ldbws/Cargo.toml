[package]
name = "poller-ldbws"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
health-http = { workspace = true }
anyhow = "1.0.102"
chrono = { version = "0.4.44", features = ["serde"] }
clap = { version = "4.6.1", features = ["derive", "env"] }
common = { workspace = true, features = ["default"] }
# The line catalogue, embedded (`--lines-dir` defaults to it).
ds-lines = { workspace = true }
ds-runtime = { workspace = true, features = ["default"] }
dotenvy = "0.15.7"
# The sample-station read (ingest architecture plan 4.5): the selection,
# the views' readers, the pool and the schema gate.
ds-store = { workspace = true }
# The stream sink (ingest architecture plan 3a.7): the
# station-samples stream producer, and its Redis client. Both already in
# the tree; ingest-stream is DB-free.
ingest-stream = { workspace = true }
metrics = "0.24"
redis = { version = "1.8", features = ["tokio-comp", "connection-manager"] }
reqwest = { version = "0.13.4", default-features = false, features = ["json", "native-tls", "gzip"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
# The pool type and the Postgres wait, as the other direct readers.
sqlx = { version = "0.8.6", features = ["postgres", "runtime-tokio", "tls-native-tls"] }
tokio = { version = "1.52.3", features = ["rt-multi-thread", "macros"] }
tracing = "0.1.44"

[dev-dependencies]
# The db-source test: a #[sqlx::test] database migrated from ds-store's
# migrations.
sqlx = { version = "0.8.6", features = ["postgres", "runtime-tokio", "tls-native-tls", "macros", "migrate"] }
wiremock = "0.6"
metrics-exporter-prometheus = { version = "0.18", default-features = false }

[lints]
workspace = true
